name: Check for New OSI Time Standards PDF

on:
  # Run daily at 9 AM Pacific Time (5 PM UTC)
  schedule:
    - cron: '0 17 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new PDF
        id: check_pdf
        run: |
          echo "Checking for changes to OSI Time Standards..."
          echo "This will detect:"
          echo "  - Newer year ranges (e.g., 2025-2026, 2026-2027, etc.)"
          echo "  - URL changes for the same year (data corrections)"

          set +e
          OUTPUT=$(node .github/scripts/check-for-new-pdf.js)
          STATUS=$?
          set -e
          echo "$OUTPUT"

          # 0 = change detected, 1 = no change, anything else = the check itself failed
          case "$STATUS" in
            0)
              echo "changes_detected=true" >> "$GITHUB_OUTPUT"
              echo "$OUTPUT" | grep '^PDF_URL=' | sed 's/^PDF_URL=/pdf_url=/' >> "$GITHUB_OUTPUT"
              echo "$OUTPUT" | grep '^LINK_TEXT=' | sed 's/^LINK_TEXT=/link_text=/' >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "changes_detected=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::check-for-new-pdf.js exited $STATUS - the OSI page could not be fetched or parsed"
              exit "$STATUS"
              ;;
          esac

      - name: Log check result
        run: |
          echo "=========================================="
          echo "Changes detected: ${{ steps.check_pdf.outputs.changes_detected }}"
          if [ "${{ steps.check_pdf.outputs.changes_detected }}" == "true" ]; then
            echo "Next: processing the new PDF"
          else
            echo "Next: ending workflow, will check again on the next scheduled run"
          fi
          echo "=========================================="

      - name: Process new PDF with pdfplumber
        if: steps.check_pdf.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through env so text scraped from the OSI page is never parsed as shell
          PDF_URL: ${{ steps.check_pdf.outputs.pdf_url }}
          LINK_TEXT: ${{ steps.check_pdf.outputs.link_text }}
        run: |
          pip install pdfplumber
          echo "=========================================="
          echo "CHANGES DETECTED - Processing PDF"
          echo "=========================================="
          bash .github/scripts/process-new-pdf.sh "$PDF_URL" "$LINK_TEXT"
